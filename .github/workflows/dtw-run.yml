name: Run DTW Analysis

on:
  workflow_dispatch:  # รันเฉพาะ manual เท่านั้น

permissions:
  contents: write   # จำเป็นสำหรับ git push

jobs:
  run-dtw:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gee-pipeline/requirements.txt

    - name: Run DTW computation
      run: |
        # สคริปต์นี้ตอนนี้จะสร้างไฟล์ชื่อ dtw_results_normalized.parquet
        python gee-pipeline/scripts/compute_dtw_from_baseline.py

    - name: Upload DTW & Aggregated results
      uses: actions/upload-artifact@v4
      with:
        name: dtw-results-all-levels
        path: |
          gee-pipeline/outputs/merged/dtw_results_normalized.parquet
          gee-pipeline/outputs/aggregated/


    - name: Commit & push DTW result
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        # ดึงอัปเดตล่าสุด
        git pull origin main || echo "No changes to pull"

        # *** จุดที่แก้ 2: สั่ง Add ไฟล์ใหม่ (Normalized) ***
        git add gee-pipeline/outputs/merged/dtw_results_normalized.parquet
        git add gee-pipeline/outputs/aggregated/
        
        # *** จุดที่แก้ 3: เปลี่ยนข้อความ Commit ***
        git commit -m "Auto: update DTW anomaly results (subdistrict, district, province)" || echo "No changes to commit"
        git push
